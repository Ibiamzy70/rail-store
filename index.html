<!doctype html>
<html lang="en" class="is-booting" data-theme="alabaster" data-ticker="cream" data-progress="hairline" data-grain="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HIGHEXT FASHION</title>
    <meta
      name="description"
      content="HIGHEXT FASHION. Elevated Motion. Accessible Luxury. Contemporary streetwear, cut with architectural precision."
    />
    <meta name="theme-color" content="#F3F3F0" />
    <meta property="og:title" content="HIGHEXT FASHION" />
    <meta property="og:description" content="Elevated Motion. Accessible Luxury." />
    <meta property="og:type" content="website" />
    <!-- Add <meta property="og:image" content="/img/og.jpg"> once you have a 1200x630 share image -->

    <!-- Inline favicon: stops the /favicon.ico 404. Replace with a real file later. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0b'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23f3f3f0'%3EH%3C/text%3E%3C/svg%3E"
    />

    <link rel="preload" href="/data/clothes.json" as="fetch" type="application/json" crossorigin />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
    <noscript><style>.is-booting *{opacity:1!important}</style></noscript>
  </head>
  <body>
    <a class="skip" href="#items">Skip to collection</a>

    <!-- Header -->
    <header class="bar">
      <a class="bar__link" id="navL" href="#about">About</a>
      <a class="bar__logo" id="logo" href="/" aria-label="HIGHEXT FASHION, home">HIGHEXT</a>
      <a class="bar__link bar__link--r" id="navR" href="#contact">Contact</a>
    </header>

    <!-- Rail: tall section, sticky stage inside -->
    <main id="rail-section" class="rail-section">
      <div class="stage" id="stage">
        <div class="stage__light" id="light" aria-hidden="true"></div>
        <h1 class="headline" id="headline" hidden></h1>

        <div class="rail">
          <svg class="rail__bar" id="railBar" aria-hidden="true" focusable="false"></svg>
          <ul class="rail__items" id="items" role="list" aria-label="Collection"></ul>
        </div>

        <div class="caption">
          <p class="caption__name" id="capName"></p>
          <a class="pill" id="capCta" target="_blank" rel="noopener">See availability</a>
        </div>

        <div class="progress" aria-hidden="true">
          <i id="progress"></i>
          <b class="progress__dot" id="progressDot"></b>
        </div>
        <p class="counter" id="counter" aria-hidden="true">
          <span id="cNow">01</span> / <span id="cTotal">01</span>
        </p>
        <p class="sr-only" id="live" aria-live="polite"></p>
      </div>
    </main>

    <!-- About and contact -->
    <section id="about" class="info">
      <div class="info__col">
        <h2>About</h2>
        <p id="aboutText"></p>
      </div>
    </section>

    <section id="contact" class="info">
      <div class="info__col">
        <h2>Contact</h2>
        <p id="contactText"></p>
      </div>
    </section>

    <!-- Ticker -->
    <div class="ticker" aria-hidden="true"><div class="ticker__track" id="ticker"></div></div>

    <!-- Detail overlay: classic hanger view + Shop the Look model view.
         Every id and class below is read by detail.js; removing one breaks boot. -->
    <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dName" hidden>
      <div class="detail__bg lb-bg"></div>
      <p class="sr-only" id="dLive" aria-live="polite"></p>

      <button class="detail__close lb-close" id="dClose" type="button">Close <span aria-hidden="true">×</span></button>
      <button class="round round--prev lb-round" id="dPrev" type="button" aria-label="Previous garment">←</button>
      <button class="round round--next lb-round" id="dNext" type="button" aria-label="Next garment">→</button>

      <div class="detail__stage">
        <!-- classic view: hanger photo (front or back) -->
        <div class="detail__frame lb-frame">
          <div class="detail__img" id="dImg"></div>
        </div>
        <!-- model view: lookbook.js builds the lineup inside this -->
        <div class="lb-stage" id="dLook" hidden></div>
      </div>

      <div class="detail__ui lb-ui">
        <p class="detail__plate" id="dPlate"></p>
        <h2 id="dName"></h2>
        <p class="detail__sub" id="dSub"></p>
        <p class="detail__price" id="dPrice"></p>

        <!-- the look: top, bottom, shoes (rows are built by detail.js) -->
        <ul class="lb-list" id="lbList" aria-label="The look"></ul>
        <p class="lb-bundlenote" id="lbBundleNote" hidden></p>
        <p class="lb-total" hidden><s id="lbWas"></s> <b id="lbNow"></b></p>
        <a class="pill lb-enquire" id="lbEnquire" target="_blank" rel="noopener" hidden>Enquire on WhatsApp</a>

        <div class="detail__row">
          <div class="seg" role="radiogroup" aria-label="View">
            <label><input type="radio" name="view" value="model" /><span>Model</span></label>
            <label><input type="radio" name="view" value="front" checked /><span>Front</span></label>
            <label><input type="radio" name="view" value="back" /><span>Back</span></label>
          </div>
          <button class="link" id="dRestyle" type="button" hidden>Restyle</button>
          <a class="link" id="dCta" target="_blank" rel="noopener"></a>
        </div>

        <!-- one step per look in the lineup -->
        <div class="lb-progress" id="dProgress"></div>
      </div>
    </div>

    <!-- Error panel -->
    <div class="error" id="error" role="alert" hidden>
      <p>We couldn't load the collection.</p>
      <button class="pill" id="retry" type="button">Retry</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
